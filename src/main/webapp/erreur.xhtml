<!DOCTYPE html>
<!-- Page d'erreur générique (404 page introuvable, 500 erreur serveur), déclarée dans web.xml. -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titre">Erreur</ui:define>

    <ui:define name="contenu">
        <div class="carte-centree">
            <p:panel header="Oups, une erreur est survenue">
                <!-- requestScope['jakarta.servlet.error.status_code'] contient le code HTTP de l'erreur -->
                <p>
                    Code : <h:outputText value="#{requestScope['jakarta.servlet.error.status_code']}"/>
                </p>
                <p>La page demandée n'existe pas ou une erreur inattendue s'est produite.</p>
                <p:button value="Retour à l'accueil" icon="pi pi-home" outcome="/index"/>
            </p:panel>
        </div>
    </ui:define>
</ui:composition>
